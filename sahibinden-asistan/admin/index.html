<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAI Bilmiş - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Ekranı -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">🤖</div>
            <h1>BAI BİLMİŞ</h1>
            <p class="login-subtitle">Admin Panel</p>
            <button id="googleLoginBtn" class="google-login-btn">
                <svg width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Google ile Giriş Yap
            </button>
            <p class="login-note">🔒 Sadece yetkili yöneticiler erişebilir</p>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="admin-panel" style="display: none;">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="logo">🤖</span>
                <h1>BAI BİLMİŞ <span class="badge">Admin</span></h1>
            </div>
            <div class="header-right">
                <img id="adminPicture" src="" alt="Admin" class="admin-avatar">
                <span id="adminName"></span>
                <button id="logoutBtn" class="logout-btn">Çıkış</button>
            </div>
        </header>

        <!-- Stats Cards -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-info">
                    <span class="stat-value" id="totalUsers">-</span>
                    <span class="stat-label">Toplam Kullanıcı</span>
                </div>
            </div>
            <div class="stat-card premium">
                <div class="stat-icon">⭐</div>
                <div class="stat-info">
                    <span class="stat-value" id="premiumUsers">-</span>
                    <span class="stat-label">Premium Üye</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-info">
                    <span class="stat-value" id="totalListings">-</span>
                    <span class="stat-label">Kayıtlı İlan</span>
                </div>
            </div>
            <div class="stat-card active">
                <div class="stat-icon">🟢</div>
                <div class="stat-info">
                    <span class="stat-value" id="activeToday">-</span>
                    <span class="stat-label">Bugün Aktif</span>
                </div>
            </div>
        </div>

        <!-- Search & Actions -->
        <div class="actions-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Kullanıcı ara (isim veya email)...">
                <button id="searchBtn">🔍</button>
            </div>
            <button id="refreshBtn" class="refresh-btn">🔄 Yenile</button>
        </div>

        <!-- Users Table -->
        <div class="table-container">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>Kullanıcı</th>
                        <th>Email</th>
                        <th>Plan</th>
                        <th>Günlük Kullanım</th>
                        <th>Son Giriş</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="6" class="loading-row">Yükleniyor...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <button id="prevPage" disabled>← Önceki</button>
            <span id="pageInfo">Sayfa 1</span>
            <button id="nextPage">Sonraki →</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
